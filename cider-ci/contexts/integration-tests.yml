script_defaults:
  timeout: 10 Minutes
  template_environment_variables: true

task_defaults:
  traits: [Bash, mise]
  max_trials: 2
  load: 1.5
  include:
    - cider-ci/task_components/build.yml
    - cider-ci/task_components/database.yml
    - cider-ci/task_components/server.yml
    - cider-ci/task_components/test.yml

  ports:
    CI_SERVER_PORT:
      min: 4100
      max: 8799

  trial_attachments:
    screenshots:
      include_match: 'tmp/screenshots/.+\.png$'
      content_type: image/png

  environment_variables:
    CIDER_CI_TEST_HEADLESS: "1"
    PGPORT: "5415"
    PGUSER: cider-ci
    GEM_HOME: /opt/cider-ci/.gem/ruby/3.1.0
    GEM_PATH: /opt/cider-ci/.gem/ruby/3.1.0:/home/ci-exec-user/.local/share/mise/installs/ruby/3.1.3/lib/ruby/gems/3.1.0
    BUNDLE_PATH: /opt/cider-ci/bundle
