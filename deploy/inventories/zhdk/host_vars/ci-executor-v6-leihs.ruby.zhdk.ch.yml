---
# ZHdK VM for the leihs deploys (Debian 13 trixie, 2 cores, 3 GB, 20 GB
# disk), the successor of the legacy ci-executor-leihs. Same trait set as
# ex01/ex02 except incus: too small for container builds. Its own executor
# record on the server, token in secrets.yml.
ci_executor_token: "{{ ci_executor_token_leihs }}"

# Cautious start (2026-11-06): one trial at a time, and only the two jobs
# deploying to the tom dev server (tom-deploy, tom-restore-deploy; 2026-11-10)
# for heads of tom.* branches of the leihs superproject; the legacy deploy
# executor keeps serving everything else. Widen job by job
# (docs/executors/accepted-repositories.md).
ci_executor_max_load: 1

# ZHdK IT gave the VM a dedicated /tmp disk (40 GB, /etc/fstab, 2026-11-02);
# the role must not mask the fstab-generated tmp.mount (emergency mode at
# boot, 2026-11-10).
ci_executor_tmp_on_disk: false
ci_executor_accepted_repositories:
  - url: 'https://github.com/leihs/leihs.git'
    branches: ['^tom.*$']
    jobs: ['^tom-deploy$', '^tom-restore-deploy$']

# ZHdK network: no host firewall (init.yml had set ufw up on 2026-11-04,
# the role removes it again on deploy).
ci_firewall_state: absent

ci_executor_trait_mise: true
ci_executor_trait_ruby: true
ci_executor_trait_postgresql: true
ci_executor_trait_stress_ng: true
ci_executor_trait_git: true
ci_executor_trait_misc: true
ci_executor_trait_apache2: true
# gettext + translate-toolkit (leihs legacy meta: pofilter)
ci_executor_trait_translation_tools: true
# Key pair for decrypting the leihs inventory's transcrypt password (recipient
# of zhdk-inventory .transcrypt_key.txt.asc); public key in gpg-pubkeys/.
ci_executor_trait_gpg: true

# Deploy targets the trial scripts ssh into (ssh-keyscan from this VM,
# 2026-11-06). The service user's public key (ssh-pubkeys/) must be
# authorized there via the leihs inventory's ssh_keys_present.
ci_executor_ssh_known_hosts:
  - 'tom-leihs.ruby.zhdk.ch ssh-rsa '
  - 'tom-leihs.ruby.zhdk.ch ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBPX8c71dPWk9/3ICXQvuryUtCi89KXhsASVGs1e3JA/XOXZZ0uDuEzkfhuZqfR66O8WTHLKUlyPPbxtEGZER7jU='
  - 'tom-leihs.ruby.zhdk.ch ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICZNyVWgQ33MOc7wQN+DHanijkVWlBWqS5t3Rrlnxm9e'

# Dispatch-marker traits, see ex01 host_vars for the rationale.
ci_executor_extra_traits:
  - "postgresql 15"
  # The leihs deploy jobs (zhdk-inventory cider-ci/job-components/deploy.yml)
  # require this custom trait; the test executors do not offer it.
  - zhdk-leihs-deploy
