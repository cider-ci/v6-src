---
- name: Create cider-ci group
  ansible.builtin.group:
    name: "{{ cider_ci_group }}"
    system: yes

# The service user runs the executor process and the trial scripts. It gets a
# real shell so developers can ssh in as this user (ci_executor_ssh_authorized_keys).
- name: Create cider-ci user (service user running the executor process)
  ansible.builtin.user:
    name: "{{ cider_ci_user }}"
    group: "{{ cider_ci_group }}"
    system: yes
    shell: /bin/bash
    home: "{{ cider_ci_base_dir }}"
    create_home: no

- name: Configure git email for the service user
  community.general.git_config:
    name: user.email
    value: "{{ cider_ci_user }}@{{ inventory_hostname }}"
    scope: global
  become_user: "{{ cider_ci_user }}"

- name: Configure git name for the service user
  community.general.git_config:
    name: user.name
    value: "{{ cider_ci_user }}"
    scope: global
  become_user: "{{ cider_ci_user }}"

# Until 2026-11 the role also created a legacy "ci-exec-user" (the legacy CI's
# trial user); on v6 nothing ever ran as it. Remove it, its home (mise installs)
# and its group where they still exist.
- name: Remove the legacy exec-user
  ansible.builtin.user:
    name: ci-exec-user
    state: absent
    remove: yes

- name: Remove the legacy exec-user group
  ansible.builtin.group:
    name: ci-exec-user
    state: absent

- name: Create executor directory
  ansible.builtin.file:
    path: "{{ ci_executor_dir }}"
    state: directory
    owner: "{{ cider_ci_user }}"
    group: "{{ cider_ci_group }}"
    mode: '0750'

- name: Create executor working directory
  ansible.builtin.file:
    path: "{{ ci_executor_dir }}/tmp"
    state: directory
    owner: "{{ cider_ci_user }}"
    group: "{{ cider_ci_group }}"
    mode: '0750'

# Trial scripts run as the service user. Projects that ssh from a trial into a
# deploy target or a container they created rely on ~/.ssh/id_ed25519.pub
# (leihs container-deploy copies it into the container's authorized_keys), so
# the service user gets a host-local key pair. Ed25519 is OpenSSH's default
# key type; post-quantum signature keys are still experimental in OpenSSH
# (10.4, not in Debian 13), the key exchange on Debian 13 is already hybrid
# PQ (mlkem768x25519) by default.
- name: Generate an SSH key pair for the service user
  ansible.builtin.user:
    name: "{{ cider_ci_user }}"
    generate_ssh_key: yes
    ssh_key_type: ed25519
    ssh_key_file: .ssh/id_ed25519
    ssh_key_comment: "{{ cider_ci_user }}@{{ inventory_hostname }}"

- name: Remove the service user's former RSA key pair
  ansible.builtin.file:
    path: "{{ cider_ci_base_dir }}/.ssh/{{ item }}"
    state: absent
  loop: [id_rsa, id_rsa.pub]

- name: Fetch the service user's SSH public key into the inventory (ssh-pubkeys/<host>.pub)
  ansible.builtin.fetch:
    src: "{{ cider_ci_base_dir }}/.ssh/id_ed25519.pub"
    dest: "{{ inventory_dir }}/ssh-pubkeys/{{ inventory_hostname }}.pub"
    flat: yes

- name: Authorize developer SSH keys for the service user
  ansible.posix.authorized_key:
    user: "{{ cider_ci_user }}"
    key: "{{ item }}"
  loop: "{{ ci_executor_ssh_authorized_keys }}"
  loop_control:
    label: "{{ item.split(' ')[2] | default(item.split(' ')[1][:24]) }}"

- name: Revoke removed developer SSH keys for the service user
  ansible.posix.authorized_key:
    user: "{{ cider_ci_user }}"
    key: "{{ item }}"
    state: absent
  loop: "{{ ci_executor_ssh_removed_keys }}"
  loop_control:
    label: "{{ item.split(' ')[2] | default(item.split(' ')[1][:24]) }}"

# Hosts the trial scripts ssh into (deploy targets): pin their host keys.
- name: Add known hosts for the service user
  ansible.builtin.known_hosts:
    path: "{{ cider_ci_base_dir }}/.ssh/known_hosts"
    name: "{{ item.split(' ')[0] }}"
    key: "{{ item }}"
  loop: "{{ ci_executor_ssh_known_hosts | default([]) }}"
  loop_control:
    label: "{{ item.split(' ')[0] }} {{ item.split(' ')[1] }}"

- name: Own the service user's known_hosts
  ansible.builtin.file:
    path: "{{ cider_ci_base_dir }}/.ssh/known_hosts"
    owner: "{{ cider_ci_user }}"
    group: "{{ cider_ci_group }}"
    mode: '0644'
  when: (ci_executor_ssh_known_hosts | default([])) | length > 0

- name: Create config directory
  ansible.builtin.file:
    path: /etc/cider-ci
    state: directory
    owner: root
    group: "{{ cider_ci_group }}"
    mode: '0750'

- name: Deploy executor jar
  ansible.builtin.copy:
    src: "{{ ci_executor_jar_path }}"
    dest: "{{ ci_executor_dir }}/cider-ci.jar"
    owner: "{{ cider_ci_user }}"
    group: "{{ cider_ci_group }}"
    mode: '0640'
  notify: Restart cider-ci-executor

- name: Write executor environment file
  ansible.builtin.template:
    src: cider-ci-executor.env.j2
    dest: /etc/cider-ci/executor.env
    owner: root
    group: "{{ cider_ci_group }}"
    mode: '0640'
  notify: Restart cider-ci-executor

- name: Install executor systemd unit
  ansible.builtin.template:
    src: cider-ci-executor.service.j2
    dest: /etc/systemd/system/cider-ci-executor.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart cider-ci-executor

- name: Write default executor traits file
  ansible.builtin.copy:
    dest: /etc/cider-ci/traits
    owner: root
    group: "{{ cider_ci_group }}"
    mode: '0640'
    content: "bash\n"
    force: no

- name: Write accepted repositories
  # read by the executor on every sync, no restart needed
  ansible.builtin.copy:
    dest: /etc/cider-ci/accepted-repositories.yml
    owner: root
    group: "{{ cider_ci_group }}"
    mode: '0640'
    content: |
      # Managed by Ansible (ci_executor_accepted_repositories).
      {{ ci_executor_accepted_repositories | to_nice_yaml(width=1000) }}

- name: Write accepted GPG keys
  # read by the executor on every sync, no restart needed
  ansible.builtin.copy:
    dest: /etc/cider-ci/accepted-gpg-keys.yml
    owner: root
    group: "{{ cider_ci_group }}"
    mode: '0640'
    content: |
      # Managed by Ansible (ci_executor_accepted_gpg_keys).
      {{ ci_executor_accepted_gpg_keys | to_nice_yaml(width=1000) }}

- name: Remove the plain accepted repositories file (replaced by the YAML file)
  ansible.builtin.file:
    path: /etc/cider-ci/accepted-repositories
    state: absent

- name: Register extra executor traits (dispatch markers for projects)
  ansible.builtin.lineinfile:
    path: /etc/cider-ci/traits
    line: "{{ item }}"
    create: yes
    owner: root
    group: "{{ cider_ci_group }}"
    mode: '0640'
  loop: "{{ ci_executor_extra_traits | default([]) }}"
  notify: Restart cider-ci-executor

- name: Remove retired executor traits
  # the trait lines above are only ever added; traits taken out of use are
  # listed in ci_executor_retired_traits so a deploy removes them again
  ansible.builtin.lineinfile:
    path: /etc/cider-ci/traits
    line: "{{ item }}"
    state: absent
  loop: "{{ ci_executor_retired_traits | default([]) }}"
  notify: Restart cider-ci-executor

- name: Check whether /etc/fstab mounts /tmp itself
  # A /tmp line in fstab makes systemd generate its own tmp.mount, required
  # by local-fs.target. Masking that one fails the target and the next boot
  # ends in emergency mode with a read-only root (ZHdK VMs, 2026-11-10).
  ansible.builtin.command: grep -Eq '^[^#[:space:]]+[[:space:]]+/tmp[[:space:]]' /etc/fstab
  register: ci_executor_fstab_tmp
  changed_when: false
  failed_when: false
  check_mode: false

- name: Keep /tmp on disk (mask the tmpfs tmp.mount of Debian 13)
  # trixie mounts /tmp as a tmpfs capped at 50% of RAM: trial working dirs
  # (checkouts, node_modules, jars) fill it and compete with the trials for
  # memory. Masking tmp.mount is Debian's way to opt out; it takes effect
  # at the next reboot (an active tmpfs is not unmounted). Never when fstab
  # provides /tmp (see above).
  ansible.builtin.systemd:
    name: tmp.mount
    masked: true
  when: ci_executor_tmp_on_disk and ci_executor_fstab_tmp.rc != 0

- name: Unmask tmp.mount where /tmp comes from fstab or the tmpfs is wanted
  ansible.builtin.systemd:
    name: tmp.mount
    masked: false
  when: not ci_executor_tmp_on_disk or ci_executor_fstab_tmp.rc == 0

- name: Exclude CI working data from systemd-tmpfiles age cleanup
  # trixie: `q /tmp 10d` / `q /var/tmp 30d` would delete untouched files
  # (git cache packs, long-running trial dirs) from under the executor.
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/cider-ci.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible (cider-ci executor): never age-clean these.
      x /tmp/cider-ci
      x /var/tmp/cider-ci-git-cache
      x /tmp/cider-ci-script-*
      # uberjar builds leave a depstar dir with ~15k files behind each time;
      # with the 10d default they exhaust the /tmp tmpfs inode limit
      e /tmp/depstar* - - - 1d
- name: Install BASH_ENV snippet so non-login trial scripts get trait environment
  ansible.builtin.copy:
    dest: /etc/cider-ci/trial-bash-env.sh
    owner: root
    group: "{{ cider_ci_group }}"
    mode: '0644'
    content: |
      # Managed by Ansible. Sourced via BASH_ENV by the non-login bash that runs
      # trial scripts. /etc/profile.d is only read by login shells, so trait
      # roles (mise, asdf, postgresql, ...) expose their environment here too.
      #
      # Only once per process tree: every child bash (a spec running
      # `bash -c`, a wrapper script) inherits BASH_ENV and would re-prepend
      # the trait dirs to PATH, overtaking whatever the parent put in front
      # (e.g. a test's fake `bundle` dir; madek's db_set_env_spec).
      if [ -z "${CIDER_CI_TRAIT_ENV_LOADED:-}" ]; then
        for _cider_ci_trait_env in /etc/profile.d/cider-ci-trait-*.sh; do
          [ -r "$_cider_ci_trait_env" ] && . "$_cider_ci_trait_env"
        done
        unset _cider_ci_trait_env
        export CIDER_CI_TRAIT_ENV_LOADED=1
      fi
  notify: Restart cider-ci-executor

- name: Install system packages required for integration tests
  ansible.builtin.apt:
    name:
      - postgresql-client
      - curl
      - jq
      - locales
      - xvfb
      - xauth      # xvfb-run needs it (leihs specs: `xvfb-run -a ... rspec`)
      - libgtk-3-0
      - libdbus-glib-1-2
      - libasound2t64
      - build-essential
      - libssl-dev
      - libreadline-dev
      - zlib1g-dev
    state: present
    update_cache: yes

- name: Generate locales required by projects (leihs createdb uses de_CH.UTF-8)
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop:
    - de_CH.UTF-8
    - en_US.UTF-8
  # A running PostgreSQL only sees a newly generated locale after a restart.
  notify: Restart trait postgresql

# mise is installed for the service user, i.e. the user the trials run as, so
# the pre-installed tool versions land in the cache the trials use.
- name: Install mise (tool version manager) for the service user
  ansible.builtin.shell:
    cmd: curl -fsSL https://mise.run | sh
    creates: "{{ cider_ci_base_dir }}/.local/bin/mise"
  become_user: "{{ cider_ci_user }}"

- name: Copy .tool-versions for tool pre-warming
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../.tool-versions"
    dest: "{{ cider_ci_base_dir }}/.tool-versions"
    owner: "{{ cider_ci_user }}"
    group: "{{ cider_ci_group }}"
    mode: '0644'

- name: Install custom mise plugin for firefox
  ansible.builtin.shell:
    cmd: >
      {{ cider_ci_base_dir }}/.local/bin/mise plugin install
      firefox https://github.com/DrTom/asdf-firefox.git
    creates: "{{ cider_ci_base_dir }}/.local/share/mise/plugins/firefox"
  become_user: "{{ cider_ci_user }}"

- name: Install custom mise plugin for geckodriver
  ansible.builtin.shell:
    cmd: >
      {{ cider_ci_base_dir }}/.local/bin/mise plugin install
      geckodriver https://github.com/DrTom/asdf-geckodriver.git
    creates: "{{ cider_ci_base_dir }}/.local/share/mise/plugins/geckodriver"
  become_user: "{{ cider_ci_user }}"

- name: Pre-install tool versions defined in .tool-versions (excluding geckodriver)
  ansible.builtin.shell:
    cmd: >
      {{ cider_ci_base_dir }}/.local/bin/mise install
      java ruby node clojure firefox
    chdir: "{{ cider_ci_base_dir }}"
  become_user: "{{ cider_ci_user }}"
  register: mise_install_result
  changed_when: "'installed' in mise_install_result.stderr"
  # Ruby 3.1.x fails to build on Debian 13 (ruby-build tries to compile OpenSSL 3.0.x
  # from source, which fails with Trixie's toolchain). Executor core only needs Java.
  ignore_errors: true

- name: Install geckodriver 0.37.1 for x86_64 from GitHub releases
  ansible.builtin.shell:
    cmd: >
      curl -fsSL
      https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
      | tar --no-same-owner -xz -C /usr/local/bin &&
      touch /usr/local/bin/.geckodriver-v0.37.1
    creates: /usr/local/bin/.geckodriver-v0.37.1

- name: Own geckodriver by root (older extractions kept the archive's uid)
  ansible.builtin.file:
    path: /usr/local/bin/geckodriver
    owner: root
    group: root
    mode: '0755'

- name: Raise inotify max_user_instances for concurrent Firefox sessions
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: "8192"
    state: present
    sysctl_file: /etc/sysctl.d/99-cider-ci-firefox.conf
    reload: yes

- name: Enable and start cider-ci-executor
  ansible.builtin.service:
    name: cider-ci-executor
    state: started
    enabled: yes
