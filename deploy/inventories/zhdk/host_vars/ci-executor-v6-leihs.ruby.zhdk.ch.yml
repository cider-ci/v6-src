---
# ZHdK VM for the leihs deploys (Debian 13 trixie, 2 cores, 3 GB, 20 GB
# disk), the successor of the legacy ci-executor-leihs. Same trait set as
# ex01/ex02 except incus: too small for container builds. Its own executor
# record on the server, token in secrets.yml.
ci_executor_token: "{{ ci_executor_token_leihs }}"

# Cautious start (2026-11-06): one trial at a time, and only the tom-deploy
# job (deploy to the tom dev server) for heads of tom.* branches of the
# leihs superproject; the legacy deploy executor keeps serving everything
# else. Widen job by job (docs/executors/accepted-repositories.md).
ci_executor_max_load: 1
ci_executor_accepted_repositories:
  - url: 'https://github.com/leihs/leihs.git'
    branches: ['^tom.*$']
    jobs: ['^tom-deploy$']

# ZHdK network: no host firewall (init.yml had set ufw up on 2026-11-04,
# the role removes it again on deploy).
ci_firewall_state: absent

ci_executor_trait_mise: true
ci_executor_trait_ruby: true
ci_executor_trait_postgresql: true
ci_executor_trait_stress_ng: true
ci_executor_trait_git: true
ci_executor_trait_misc: true
ci_executor_trait_apache2: true
# gettext + translate-toolkit (leihs legacy meta: pofilter)
ci_executor_trait_translation_tools: true

# Dispatch-marker traits, see ex01 host_vars for the rationale.
ci_executor_extra_traits:
  - "postgresql 15"
  # The leihs deploy jobs (zhdk-inventory cider-ci/job-components/deploy.yml)
  # require this custom trait; the test executors do not offer it.
  - zhdk-leihs-deploy
