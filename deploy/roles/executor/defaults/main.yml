---
# Path to the pre-built uberjar on the Ansible control machine (same jar as server).
# ci_executor_jar_path: /path/to/cider-ci.jar   # required — no default

ci_executor_dir: "{{ cider_ci_base_dir }}/executor"
ci_executor_server_url: "http://localhost:3838"
# ci_executor_token: set in vault (the bearer token created via admin UI)
ci_executor_max_load: 4
ci_executor_exec_user: ci-exec-user
ci_executor_java_xmx: 256m

# Traits removed from executors on deploy (the extra-trait lines are only ever
# added). Set per inventory, e.g. the ZHdK group_vars.
ci_executor_retired_traits: []

# Repositories the executor accepts trials for. An entry is a url pattern or
# {url, branches}; a pattern is an exact value or a regex written as ^...$.
# Without branches any commit reachable on the repository's origin is
# accepted; with branches only the head of a matching branch (verified on
# the origin, so the git host's branch protection applies). The executor
# reports the list on every sync; the server only dispatches matching trials.
# A deploy executor for production, e.g.:
#   ci_executor_accepted_repositories:
#     - url: 'https://github.com/Madek/Madek.git'
#       branches: ['^master$']
ci_executor_accepted_repositories: ['^.*$']

# Before running a trial the executor checks that the commit is reachable
# from a branch or tag of the repository's real remote (git ls-remote), not
# only on the CIDER-CI server it fetched it from.
ci_executor_verify_origin: true
