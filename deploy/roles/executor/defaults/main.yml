---
# Path to the pre-built uberjar on the Ansible control machine (same jar as server).
# ci_executor_jar_path: /path/to/cider-ci.jar   # required — no default

ci_executor_dir: "{{ cider_ci_base_dir }}/executor"
ci_executor_server_url: "http://localhost:3838"
# ci_executor_token: set in vault (the bearer token created via admin UI)
ci_executor_max_load: 4
ci_executor_java_xmx: 256m
# Further JVM flags; same per-thread temporary direct buffer cap as the
# server (see the server role defaults), relevant for attachment uploads.
ci_executor_java_opts: "-Djdk.nio.maxCachedBufferSize=1048576"

# Mask Debian 13's tmpfs on /tmp so trial working dirs live on disk (needs
# a reboot to take effect, see the task).
ci_executor_tmp_on_disk: true

# Traits removed from executors on deploy (the extra-trait lines are only ever
# added). Set per inventory, e.g. the ZHdK group_vars.
ci_executor_retired_traits: []

# Repositories the executor accepts trials for. An entry is a url pattern or
# {url, branches, jobs}; a pattern is an exact value or a regex written as
# ^...$. Without branches any commit reachable on the repository's origin is
# accepted; with branches only the head of a matching branch (verified on
# the origin, so the git host's branch protection applies). jobs matches the
# job key from cider-ci.yml; it is a SOFT restriction (renaming a job
# circumvents it), so combine it with branches on deploy executors. The
# executor reports the list on every sync; the server only dispatches
# matching trials. See docs/executors/accepted-repositories.md.
# A deploy executor for production, e.g.:
#   ci_executor_accepted_repositories:
#     - url: 'https://github.com/Madek/Madek.git'
#       branches: ['^master$']
#       jobs: ['^deploy_production$']
ci_executor_accepted_repositories: ['^.*$']

# Public GPG keys (ASCII armored) the executor accepts commit signatures of.
# With keys the executor only runs trials of commits signed with one of them
# (the server dispatches only those, the executor verifies the signature
# itself before anything runs); an empty list accepts any commit, signed or
# not. The keys must also be known to the server (a user's key, imported
# from GitHub, or a global key), otherwise no commit is verified against
# them. See docs/executors/accepted-gpg-keys.md. E.g.:
#   ci_executor_accepted_gpg_keys:
#     - "{{ lookup('file', 'files/gpg/release-manager.asc') }}"
ci_executor_accepted_gpg_keys: []

# Before running a trial the executor checks that the commit is reachable
# from a branch or tag of the repository's real remote (git ls-remote), not
# only on the CIDER-CI server it fetched it from.
ci_executor_verify_origin: true

# SSH public keys (one authorized_keys line each) that may log in as the
# service user, i.e. as the user the trial scripts run as. Developers use this
# to inspect an executor the way a trial sees it (mise installs, gpg and ssh
# state, working directories). Keys listed in the removed list are revoked.
ci_executor_ssh_authorized_keys: []
ci_executor_ssh_removed_keys: []
