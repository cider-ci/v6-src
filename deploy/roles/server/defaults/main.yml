---
# Path to the pre-built uberjar on the Ansible control machine.
# Build with: clj -T:build-leihs uber  (or however the project builds)
# ci_server_jar_path: /path/to/cider-ci.jar   # required — no default

ci_server_dir: "{{ cider_ci_base_dir }}/server"
ci_server_http_port: 3838
ci_server_http_bind: "0.0.0.0"
ci_server_http_threads: 4

ci_server_db_name: "{{ ci_db_name }}"
ci_server_db_port: "{{ pg_port }}"
ci_server_db_host: localhost
ci_server_db_user: "{{ ci_db_user }}"
# ci_server_db_password: "{{ ci_db_password }}"  — inherits from postgresql role defaults

ci_server_java_xmx: 512m
# Further JVM flags. jdk.nio.maxCachedBufferSize: the JDK copies every heap
# buffer written to a socket into a temporary direct buffer that it caches
# per thread (up to 1024 entries, no size cap by default). http-kit's
# long-lived selector thread thus accumulates one buffer per distinct large
# response size (attachments, git packs) until the direct memory limit
# (= Xmx) is hit and every large response fails with an OutOfMemoryError
# (seen 2026-11-10, 24 MB git-upload-pack vs 520 MB cached). With the cap,
# larger temporary buffers are freed right after the write.
ci_server_java_opts: "-Djdk.nio.maxCachedBufferSize=1048576"

# GitHub sign-in (docs/github-sign-in.md): written to
# /etc/cider-ci/github-sign-in.yml when client_id and client_secret are set.
#
# ci_server_github_sign_in:
#   client_id: "{{ ci_github_client_id }}"
#   client_secret: "{{ ci_github_client_secret }}"   # keep it in secrets.yml
#   rules:                                           # ordered, first match wins
#     - {organization: example-org, team: ci-admins, admin: true}
#     - {organization: example-org}
ci_server_github_sign_in: {}
