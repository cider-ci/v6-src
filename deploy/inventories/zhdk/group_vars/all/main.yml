---
ansible_user: root

# --- Paths -------------------------------------------------------------------
ci_server_jar_path: "{{ playbook_dir }}/../target/cider-ci.jar"
ci_executor_jar_path: "{{ playbook_dir }}/../target/cider-ci.jar"

# --- Database ----------------------------------------------------------------
ci_server_db_name: cider_ci_v6
# ci_db_password — defined in secrets.yml (transcrypt-encrypted)

# --- Initial admin account ---------------------------------------------------
ci_admin_login: admin
# ci_admin_password — defined in secrets.yml (transcrypt-encrypted)

# --- Server ------------------------------------------------------------------
ci_server_http_port: 3838
ci_server_http_bind: "127.0.0.1"

# --- GitHub sign-in (docs/github-sign-in.md) --------------------------------
# Active once ci_github_client_id and ci_github_client_secret are defined in
# secrets.yml (OAuth App with the callback
# https://ci.zhdk.cider-ci.com/sign-in/github/callback).
ci_server_github_sign_in:
  client_id: "{{ ci_github_client_id | default('') }}"
  client_secret: "{{ ci_github_client_secret | default('') }}"
  rules:
    - {organization: zhdk, team: 'ci.zhdk Admins', admin: true}
    - {organization: zhdk, team: 'Ruby Developers'}

# --- Executor ----------------------------------------------------------------
# ci_executor_token — defined in secrets.yml (transcrypt-encrypted); ex02
# overrides it per host (ci_executor_token_ex02). ci_executor_name is only
# used by provision.yml to seed the first executor record; further
# executors are registered via the admin UI (/executors/new).
ci_executor_name: ex01.ci.zhdk.cider-ci.com
ci_executor_max_load: 16
ci_executor_server_url: "https://ci.zhdk.cider-ci.com"
ci_executor_accepted_repositories:
  - '^https://github\.com/(cider-ci|leihs|Madek)/.+$'

# --- SSH (used by init.yml) --------------------------------------------------
ci_ssh_port: 22
ci_authorized_keys:
  - "ssh-rsa  DrTom@schank.ch"

# --- Reverse proxy / SSL -----------------------------------------------------
ci_hostname: ci.zhdk.cider-ci.com
ci_ssl_certificate_file: /etc/letsencrypt/live/ci.zhdk.cider-ci.com/fullchain.pem
ci_ssl_certificate_key_file: /etc/letsencrypt/live/ci.zhdk.cider-ci.com/privkey.pem
ci_force_redirect_to_https: true

# --- Certbot (Let's Encrypt) -------------------------------------------------
ci_certbot_email: Thomas.Schank@zhdk.ch

# Executor traits removed on deploy (the role only ever adds trait lines).
# - JDK: toolchains come from the projects' .tool-versions via mise, not from
#   a marker trait (briefly deployed for madek mail on 2026-10-21).
# - asdf: retired 2026-10-21, mise is the tool versions manager; tasks still
#   requiring the asdf trait stay pending and expose the remaining asdf
#   dependencies in the project configurations.
# - firefox-esr: Firefox comes from the projects' .tool-versions via mise
#   (retired 2026-10-21, same reasoning as asdf).
ci_executor_retired_traits:
  - JDK
  - asdf
  - firefox-esr
