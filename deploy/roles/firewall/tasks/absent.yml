---
# Undo what present.yml (formerly init.yml) set up: unload the rules, purge
# the package and its configuration, and put the iptables alternatives back
# into auto mode (the nf_tables backend on Debian).
- name: Check whether ufw is installed
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: firewall_ufw_bin

- name: Disable ufw (unloads its rules)
  community.general.ufw:
    state: disabled
  when: firewall_ufw_bin.stat.exists

- name: Purge ufw
  ansible.builtin.apt:
    name: ufw
    state: absent
    purge: yes

- name: Check for the iptables alternatives groups
  ansible.builtin.command: update-alternatives --query {{ item }}
  loop: [iptables, ip6tables]
  register: firewall_alternatives
  changed_when: false
  failed_when: false

- name: Reset the iptables alternatives to auto
  community.general.alternatives:
    name: "{{ item.item }}"
    path: "/usr/sbin/{{ item.item }}-legacy"
    state: auto
  loop: "{{ firewall_alternatives.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 0

# `ufw disable` leaves its (now empty) chains and the jumps into them in the
# filter tables (chains ufw-* and, for IPv6, ufw6-*) until the next reboot.
# Flush and delete them from every
# backend where ufw chains exist; with no host firewall there are no other
# filter rules to keep.
- name: Check for leftover ufw chains
  ansible.builtin.shell: >
    test -x /usr/sbin/{{ item }} && /usr/sbin/{{ item }} -S | grep -Eq '^-N ufw6?-'
  loop: [iptables-legacy, ip6tables-legacy, iptables-nft, ip6tables-nft]
  register: firewall_ufw_chains
  changed_when: false
  failed_when: false

- name: Remove leftover ufw chains
  ansible.builtin.shell: /usr/sbin/{{ item.item }} -F && /usr/sbin/{{ item.item }} -X
  loop: "{{ firewall_ufw_chains.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 0
