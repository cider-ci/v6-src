scripts:
  server-run:
    ignore_state: true
    start_when:
      db-migrated:
        script_key: migrate-database
    body: |
      #!/usr/bin/env bash
      set -euo pipefail
      export PGDATABASE="cider_ci_v6_${CIDER_CI_TRIAL_ID}"
      echo $$ > "${CIDER_CI_WORKING_DIR}/server.pid"
      java -jar target/cider-ci.jar server run \
          --http-server-bind 127.0.0.1 \
          --http-server-port "${CI_SERVER_PORT}" \
          --http-server-threads 4 &
      SERVER_PID=$!
      cleanup() {
        kill -TERM "$SERVER_PID" 2>/dev/null || true
        wait "$SERVER_PID" 2>/dev/null || true
        exit 0
      }
      trap cleanup TERM
      wait "$SERVER_PID"

  server-ready:
    start_when:
      server-executing:
        script_key: server-run
        states: [executing]
    terminate_when:
      server-terminal:
        script_key: server-run
        states: [passed, failed, aborted, defective]
    timeout: 3 Minutes
    body: |
      #!/usr/bin/env bash
      set -euo pipefail
      until curl -sf "http://127.0.0.1:${CI_SERVER_PORT}/"; do sleep 1; done

  server-stop:
    ignore_state: true
    start_when:
      test-terminal:
        script_key: test
        states: [passed, failed, aborted, defective, skipped]
    body: |
      #!/usr/bin/env bash
      set -euo pipefail
      PID_FILE="${CIDER_CI_WORKING_DIR}/server.pid"
      if [ ! -f "$PID_FILE" ]; then exit 0; fi
      PID=$(cat "$PID_FILE")
      if ! kill -0 "$PID" 2>/dev/null; then exit 0; fi
      kill -TERM "$PID"
      for i in $(seq 1 30); do
        kill -0 "$PID" 2>/dev/null || exit 0
        sleep 1
      done
      kill -KILL "$PID" 2>/dev/null || true
      exit 0
