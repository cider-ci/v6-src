---
ansible_user: root

# --- Paths -------------------------------------------------------------------
ci_server_jar_path: "{{ playbook_dir }}/../target/cider-ci.jar"
ci_executor_jar_path: "{{ playbook_dir }}/../target/cider-ci.jar"

# --- Database ----------------------------------------------------------------
ci_server_db_name: cider_ci_v6
ci_db_password: CHANGE_ME

# --- Initial admin account ---------------------------------------------------
ci_admin_login: admin
ci_admin_password: CHANGE_ME

# --- Server ------------------------------------------------------------------
ci_server_http_port: 3838
ci_server_http_bind: "127.0.0.1"

# --- Executor ----------------------------------------------------------------
ci_executor_token: CHANGE_ME   # generate with: uuidgen

# --- SSH (used by init.yml) --------------------------------------------------
ci_ssh_port: 22
ci_authorized_keys:
  - "ssh-rsa  DrTom@schank.ch"

# --- Reverse proxy / SSL -----------------------------------------------------
ci_hostname: ci.zhdk.cider-ci.com
ci_ssl_certificate_file: /etc/letsencrypt/live/ci.zhdk.cider-ci.com/fullchain.pem
ci_ssl_certificate_key_file: /etc/letsencrypt/live/ci.zhdk.cider-ci.com/privkey.pem
ci_force_redirect_to_https: true

# --- Certbot (Let's Encrypt) -------------------------------------------------
ci_certbot_email: Thomas.Schank@zhdk.ch
