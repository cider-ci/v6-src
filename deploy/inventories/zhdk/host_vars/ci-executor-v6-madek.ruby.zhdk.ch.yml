---
# ZHdK VM for the Madek projects (Debian 13 trixie, 2 cores, 3 GB, 20 GB
# disk). One trial at a time (ci_executor_max_load 1, since 2026-11-13). Same
# trait set as ex01/ex02 except incus: too small for container builds. Its
# own executor record on the server, token in secrets.yml.
ci_executor_token: "{{ ci_executor_token_madek }}"
ci_executor_max_load: 1

# Only the madek deploy jobs to the ZHdK machines (deploy/cider-ci/jobs.yml
# of the superproject: deploy_medienarchive, deploy_staging*, deploy_test*,
# deploy_dev_*), any branch. Not the container deploy test
# (test-containers-deploy, needs incus) and no test jobs
# (docs/executors/accepted-repositories.md).
ci_executor_accepted_repositories:
  - url: 'https://github.com/Madek/Madek.git'
    jobs: ['^deploy_.*$']

# ZHdK network: no host firewall (init.yml had set ufw up on 2026-11-04,
# the role removes it again on deploy).
ci_firewall_state: absent

ci_executor_trait_mise: true
ci_executor_trait_ruby: true
ci_executor_trait_postgresql: true
ci_executor_trait_stress_ng: true
ci_executor_trait_git: true
ci_executor_trait_misc: true
ci_executor_trait_apache2: true
# gettext + translate-toolkit (leihs legacy meta: pofilter)
ci_executor_trait_translation_tools: true

# Dispatch-marker traits, see ex01 host_vars for the rationale.
ci_executor_extra_traits:
  - "postgresql 15"
  # The madek deploy jobs (deploy/cider-ci/jobs/deploy-defaults.yml) require
  # this custom trait, as the legacy ci-executor-madek offered it; the test
  # executors do not.
  - ci-executor.madek

# ZHdK IT gave the VM a dedicated /tmp disk (20 GB, /etc/fstab, 2026-11-02);
# the role must not mask the fstab-generated tmp.mount (emergency mode at
# boot, 2026-11-10).
ci_executor_tmp_on_disk: false
