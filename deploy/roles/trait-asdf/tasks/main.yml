---
- name: Install asdf build dependencies
  ansible.builtin.apt:
    name:
      - autoconf
      - bison
      - build-essential
      - libdb-dev
      - libffi-dev
      - libgdbm-dev
      - libgdbm6
      - libgmp-dev
      - libncurses5-dev
      - libreadline6-dev
      - libssl-dev
      - libyaml-dev
      - patch
      - rustc
      - unzip
      - uuid-dev
      - zip
      - zlib1g-dev
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Create asdf home directory
  ansible.builtin.file:
    path: "{{ cider_ci_base_dir }}/.asdf"
    state: directory
    owner: "{{ cider_ci_user }}"
    group: "{{ cider_ci_group }}"
    mode: '0755'

- name: Create asdf plugins directory
  ansible.builtin.file:
    path: "{{ cider_ci_base_dir }}/.asdf/plugins"
    state: directory
    owner: "{{ cider_ci_user }}"
    group: "{{ cider_ci_group }}"
    mode: '0755'

- name: Download and unpack asdf {{ ci_executor_trait_asdf_version }}
  ansible.builtin.unarchive:
    src: "https://github.com/asdf-vm/asdf/archive/refs/tags/v{{ ci_executor_trait_asdf_version }}.tar.gz"
    remote_src: yes
    dest: "{{ cider_ci_base_dir }}/.asdf"
    owner: root
    group: "{{ cider_ci_group }}"
    creates: "{{ ci_executor_trait_asdf_dir }}/asdf.sh"

- name: Install asdf profile.d snippet
  ansible.builtin.copy:
    dest: /etc/profile.d/cider-ci-trait-asdf.sh
    owner: root
    group: root
    mode: '0644'
    content: |
      source {{ ci_executor_trait_asdf_dir }}/asdf.sh
      source {{ ci_executor_trait_asdf_dir }}/completions/asdf.bash

- name: Register asdf trait in executor traits file
  ansible.builtin.lineinfile:
    path: /etc/cider-ci/traits
    line: "asdf"
