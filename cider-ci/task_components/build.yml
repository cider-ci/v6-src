scripts:
  build-jar:
    timeout: 10 Minutes
    exclusive_executor_resource: cider-ci-v6-build
    body: |
      #!/usr/bin/env bash
      set -euo pipefail
      # Install only the tools needed for building (geckodriver is installed
      # system-wide on ARM64 and cannot be installed via the asdf plugin there).
      mise install java node clojure
      eval "$(mise activate bash)"
      CACHE_JAR="/tmp/cider-ci-v6/$(git rev-parse HEAD).jar"
      mkdir -p /tmp/cider-ci-v6
      if [ ! -f "$CACHE_JAR" ]; then
        npm ci
        npx shadow-cljs release cider-ci
        clojure -T:build-leihs uber
        cp target/cider-ci.jar "$CACHE_JAR"
      fi
      mkdir -p target
      cp "$CACHE_JAR" target/cider-ci.jar

      # Restore demo project bare repo so specs can fetch from it via "local" remote
      mkdir -p data/repositories
      git clone --bare cider-ci/fixtures/demo-project.bundle data/repositories/cider-ci-demo-project
      git -C data/repositories/cider-ci-demo-project remote add local "$(pwd)/cider-ci/fixtures/demo-project.bundle"
