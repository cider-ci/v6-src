---
ci_executor_trait_mise: true
# system Ruby (trixie: 3.3), so the "ruby" trait is real and not just a marker
ci_executor_trait_ruby: true
ci_executor_trait_postgresql: true
ci_executor_trait_stress_ng: true
ci_executor_trait_git: true
# leihs container-build: `incus launch --ephemeral images:debian/bookworm/amd64`
ci_executor_trait_incus: true
# ImageMagick, ExifTool, Graphviz, Hunspell, Xvfb (legacy traits/misc)
ci_executor_trait_misc: true
# leihs integration tests run their own apache2 reverse proxy per trial
ci_executor_trait_apache2: true

# Dispatch-marker traits required by projects so their tasks match this
# executor. The projects pinned toolchains (Ruby, Java, Clojure, Node) are
# installed on demand via mise (see trait-mise); "asdf" here is a capability
# marker, not an asdf install. "ruby" is provided by trait-ruby above.
# "postgresql 15" mirrors the versioned trait the leihs config expects
# (the postgresql trait role provisions PG 15 and its PG15* env vars).
ci_executor_extra_traits:
  - "postgresql 15"
  - asdf
  # leihs specs jobs require Firefox-ESR; Firefox is provided via mise
  # (executor role installs the firefox plugin) and xvfb is installed.
  - firefox-esr

