scripts:
  create-database:
    body: |
      #!/usr/bin/env bash
      set -euo pipefail
      # Clone template0, not template1: createdb from template1 fails whenever
      # any other session is connected to template1 (other projects' trials
      # run `psql -d template1` on the shared executor cluster) — "source
      # database template1 is being accessed by other users" took down a
      # whole server-ui run. template0 never accepts connections. Retry a few
      # times for any other transient contention.
      for attempt in 1 2 3 4 5 6; do
        if createdb -T template0 "cider_ci_v6_${CIDER_CI_TRIAL_ID}"; then exit 0; fi
        [ "$attempt" = 6 ] && exit 1
        sleep $((attempt * 5))
      done

  migrate-database:
    start_when:
      db-created:
        script_key: create-database
      jar-ready:
        script_key: build-jar
    body: |
      #!/usr/bin/env bash
      set -euo pipefail
      PGDATABASE="cider_ci_v6_${CIDER_CI_TRIAL_ID}" \
        java -jar target/cider-ci.jar server db migrate

  delete-database:
    ignore_state: true
    start_when:
      test-terminal:
        script_key: test
        states: [passed, failed, aborted, defective, skipped]
    body: |
      #!/usr/bin/env bash
      dropdb --if-exists --force "cider_ci_v6_${CIDER_CI_TRIAL_ID}"
