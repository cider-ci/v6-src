---
- name: Create cider-ci group
  ansible.builtin.group:
    name: "{{ cider_ci_group }}"
    system: yes

- name: Create cider-ci user
  ansible.builtin.user:
    name: "{{ cider_ci_user }}"
    group: "{{ cider_ci_group }}"
    system: yes
    shell: /usr/sbin/nologin
    home: "{{ cider_ci_base_dir }}"
    create_home: no

- name: Create server directory
  ansible.builtin.file:
    path: "{{ ci_server_dir }}"
    state: directory
    owner: "{{ cider_ci_user }}"
    group: "{{ cider_ci_group }}"
    mode: '0750'

- name: Create config directory
  ansible.builtin.file:
    path: /etc/cider-ci
    state: directory
    owner: root
    group: "{{ cider_ci_group }}"
    mode: '0750'

- name: Create git repositories directory
  ansible.builtin.file:
    path: "{{ ci_server_dir }}/data/repositories"
    state: directory
    owner: "{{ cider_ci_user }}"
    group: "{{ cider_ci_group }}"
    mode: '0750'

- name: Deploy server jar
  ansible.builtin.copy:
    src: "{{ ci_server_jar_path }}"
    dest: "{{ ci_server_dir }}/cider-ci.jar"
    owner: "{{ cider_ci_user }}"
    group: "{{ cider_ci_group }}"
    mode: '0640'
  register: jar_result

- name: Write server environment file
  ansible.builtin.template:
    src: cider-ci-server.env.j2
    dest: /etc/cider-ci/server.env
    owner: root
    group: "{{ cider_ci_group }}"
    mode: '0640'
  register: env_result

# GitHub sign-in (docs/github-sign-in.md); the server re-reads the file when
# it changes, no restart needed. Without client id and secret it is removed
# and the sign-in is not offered.
- name: Decide whether GitHub sign-in is configured
  ansible.builtin.set_fact:
    ci_server_github_sign_in_enabled: >-
      {{ (ci_server_github_sign_in.client_id | default('') | string | length > 0)
         and (ci_server_github_sign_in.client_secret | default('') | string | length > 0) }}

- name: Write GitHub sign-in configuration
  ansible.builtin.copy:
    content: "{{ ci_server_github_sign_in | to_nice_yaml }}"
    dest: /etc/cider-ci/github-sign-in.yml
    owner: root
    group: "{{ cider_ci_group }}"
    mode: '0640'
  no_log: true
  when: ci_server_github_sign_in_enabled | bool

- name: Remove GitHub sign-in configuration
  ansible.builtin.file:
    path: /etc/cider-ci/github-sign-in.yml
    state: absent
  when: not (ci_server_github_sign_in_enabled | bool)

- name: Install server systemd unit
  ansible.builtin.template:
    src: cider-ci-server.service.j2
    dest: /etc/systemd/system/cider-ci-server.service
    owner: root
    group: root
    mode: '0644'
  register: unit_result

- name: Reload systemd daemon if unit file changed
  ansible.builtin.systemd:
    daemon_reload: yes
  when: unit_result.changed

- name: Run database migrations
  ansible.builtin.command:
    cmd: >
      /usr/bin/java -jar {{ ci_server_dir }}/cider-ci.jar server db migrate
  environment:
    PGHOST: "{{ ci_server_db_host }}"
    PGPORT: "{{ ci_server_db_port }}"
    PGDATABASE: "{{ ci_server_db_name }}"
    PGUSER: "{{ ci_server_db_user }}"
    PGPASSWORD: "{{ ci_server_db_password | default(ci_db_password) }}"
  become_user: "{{ cider_ci_user }}"
  register: db_migrate_result
  changed_when: "'Migrating' in db_migrate_result.stdout"

- name: Enable and start cider-ci-server
  ansible.builtin.service:
    name: cider-ci-server
    state: started
    enabled: yes

- name: Restart cider-ci-server after changes
  ansible.builtin.service:
    name: cider-ci-server
    state: restarted
  when: jar_result.changed or env_result.changed or unit_result.changed or db_migrate_result.changed

- name: Wait for server to be ready
  ansible.builtin.wait_for:
    host: "{{ ci_server_http_bind if ci_server_http_bind != '0.0.0.0' else 'localhost' }}"
    port: "{{ ci_server_http_port }}"
    timeout: 60
