---
# Ported from the legacy ZHdK inventory role traits/apache2. Projects start
# their own apache2 instance inside a trial (leihs integration tests:
# `/usr/sbin/apache2 -d reverse-proxy/ -f conf/httpd.conf -DFOREGROUND`, whose
# httpd.conf includes /etc/apache2/mods-enabled/*.load), so the modules must
# be enabled system-wide; the system service itself is not needed.
ci_executor_trait_apache2_modules:
  - cache
  - cache_disk
  - cache_socache
  - expires
  - headers
  - proxy
  - proxy_http
  - proxy_wstunnel
  - rewrite
  - socache_shmcb
  - ssl
  - unique_id
  - xsendfile
